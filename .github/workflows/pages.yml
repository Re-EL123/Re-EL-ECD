name: Deploy web app to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Prepare static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate before publishing
        run: npm run lint && npm run check:migrations && npm run check:functions && npm test

      - name: Inject deployment config (API, SEO, analytics)
        env:
          API_ORIGIN: ${{ vars.REEL_API_BASE }}
          SITE_BASE: ${{ vars.REEL_SITE_BASE }}
          PLATFORM_URL: ${{ vars.REEL_PLATFORM_URL }}
          GA4_ID: ${{ vars.REEL_GA4_MEASUREMENT_ID }}
          SEARCH_VERIFICATION: ${{ vars.REEL_SEARCH_CONSOLE_VERIFICATION }}
        run: |
          node -e "
          const fs = require('fs');
          const q = (v) => JSON.stringify(v || '');
          const lines = [
            '/* Generated by .github/workflows/pages.yml */',
            'window.REEL_API_BASE = ' + q(process.env.API_ORIGIN) + ';',
            'window.REEL_SITE_BASE = ' + q(process.env.SITE_BASE) + ';',
            'window.REEL_PLATFORM_URL = ' + q(process.env.PLATFORM_URL) + ';',
            'window.REEL_GA4_MEASUREMENT_ID = ' + q(process.env.GA4_ID) + ';',
            'window.REEL_SEARCH_CONSOLE_VERIFICATION = ' + q(process.env.SEARCH_VERIFICATION) + ';'
          ];
          fs.writeFileSync('apps/web/config.js', lines.join('\n') + '\n');
          "

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
