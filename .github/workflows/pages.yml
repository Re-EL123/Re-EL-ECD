name: Deploy web app to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Prepare static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate before publishing
        run: npm run lint && npm run check:migrations && npm run check:functions && npm test

      - name: Inject API origin
        env:
          API_ORIGIN: ${{ vars.REEL_API_BASE }}
        run: |
          if [ -z "$API_ORIGIN" ]; then
            echo "::warning::REEL_API_BASE is not set. The site will call the API on its own origin."
            API_ORIGIN=""
          fi
          cat > apps/web/config.js <<EOF
          /* Generated by .github/workflows/pages.yml */
          window.REEL_API_BASE = window.REEL_API_BASE || '${API_ORIGIN}';
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
