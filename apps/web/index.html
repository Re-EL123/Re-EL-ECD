<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Re-EL ECD — a complete early childhood development management platform for daycare centres, principals, teachers, families and platform administrators.">
  <meta name="theme-color" content="#0B534A">
  <title>Re-EL ECD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css?v=20261204">
  <link rel="icon" href="assets/branding/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/branding/favicon-64.png" sizes="64x64" type="image/png">
  <link rel="apple-touch-icon" href="assets/branding/apple-touch-icon.png">
  <meta property="og:title" content="Re-EL ECD">
  <meta property="og:description" content="Early childhood, elevated — one calm workspace for enrolment, learning, families and finance.">
  <meta property="og:image" content="assets/branding/logo-re-el-ecd.png">
  <meta property="og:type" content="website">
  <!-- Vendor libraries are self-hosted: a blocked CDN must not stop the app booting. -->
  <!-- Icons are cosmetic: load them async so a slow request never delays boot. -->
  <script src="vendor/lucide.min.js?v=20261204" async onload="if (window.lucide) window.lucide.createIcons()"></script>
  <script src="vendor/gsap.min.js?v=20261204" defer></script>
  <script src="vendor/chart.umd.min.js?v=20261204" defer></script>
  <!-- qr-code-styling 1.9.2 (MIT) - QR codes are generated locally in the browser -->
  <script src="config.js?v=20261204"></script>
  <script src="src/utils.js?v=20261204" defer></script>
  <script src="src/views/public.js?v=20261204" defer></script>
  <script src="src/views/platform.js?v=20261204" defer></script>
  <script src="src/views/overview.js?v=20261204" defer></script>
  <script src="src/views/learners.js?v=20261204" defer></script>
  <script src="src/views/admissions.js?v=20261204" defer></script>
  <script src="src/views/curriculum.js?v=20261204" defer></script>
  <script src="src/views/assessments.js?v=20261204" defer></script>
  <script src="src/views/attendance.js?v=20261204" defer></script>
  <script src="src/views/staff.js?v=20261204" defer></script>
  <script src="src/views/forms.js?v=20261204" defer></script>
  <script src="src/views/communications.js?v=20261204" defer></script>
  <script src="src/views/finance.js?v=20261204" defer></script>
  <script src="src/views/safety.js?v=20261204" defer></script>
  <script src="src/views/operations.js?v=20261204" defer></script>
  <script src="src/views/settings.js?v=20261204" defer></script>
  <script src="src/views/parent.js?v=20261204" defer></script>
  <script src="src/views/manuals.js?v=20261204" defer></script>
  <script src="src/app.js?v=20261204" defer></script>
  <script src="vendor/alpine.min.js?v=20261204" defer></script>
</head>
<body x-data="reelApp()" x-init="boot()" @keydown.window.escape="closeOverlays()" @keydown.window.k="if (($event.metaKey || $event.ctrlKey) && !$event.shiftKey) { $event.preventDefault(); openCommand(); }">

  <a href="#view-root" class="sr-only">Skip to main content</a>

  <!-- Boot / session restore -->
  <div x-show="mode === 'loading'" class="loading-block" style="min-height:100vh">
    <span class="spinner spinner-lg"></span>
    <span>Loading Re-EL ECD…</span>
  </div>

  <!-- Public daycare website and public forms -->
  <div x-show="mode === 'public'" x-cloak>
    <div id="public-root"></div>
  </div>

  <!-- Authentication -->
  <div x-show="mode === 'login'" x-cloak>
    <div id="auth-root"></div>
  </div>

  <!-- Authenticated application shell -->
  <div x-show="mode === 'app'" x-cloak class="shell" @resize.window="navFlyout = null">
    <div x-show="platformBanner && !bannerDismissed" x-cloak class="banner banner-info banner-platform" :class="'banner-' + (platformBanner ? platformBanner.tone : 'info')">
      <span x-text="platformBanner ? platformBanner.message : ''"></span>
      <button type="button" class="btn btn-ghost btn-sm" @click="bannerDismissed = true" aria-label="Dismiss banner"><i data-lucide="x"></i></button>
    </div>
    <div x-show="impersonated" x-cloak class="impersonation-bar">
      <span class="impersonation-icon"><i data-lucide="eye"></i></span>
      <span x-text="impersonationLabel" class="impersonation-copy"></span>
      <span class="impersonation-countdown" x-text="impersonationTimeLabel"></span>
      <button type="button" class="btn btn-sm btn-secondary" @click="stopImpersonation()"><i data-lucide="undo-2"></i> Return to platform</button>
    </div>
    <div class="sidebar-scrim" x-show="sidebarOpen" @click="closeSidebar()"></div>
    <aside class="sidebar" :class="{ open: sidebarOpen, collapsed: sidebarCollapsed }" aria-label="Primary navigation">
      <div class="sidebar-brand">
        <span class="brand-logo" :class="{ 'brand-logo-fallback': !brandLogo }">
          <img x-show="brandLogo" :src="brandLogo" alt="" width="40" height="40">
          <span x-show="!brandLogo" x-text="brandInitial"></span>
        </span>
        <div class="sidebar-brand-text" style="min-width:0">
          <div class="brand-name" x-text="brandName"></div>
          <div class="brand-sub" x-text="brandTagline"></div>
        </div>
        <button type="button" class="btn btn-ghost btn-icon btn-sm sidebar-close row-end" @click="closeSidebar()" aria-label="Close navigation">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="sidebar-scroll">
        <template x-for="group in navGroups" :key="group.label">
          <div class="nav-group" @mouseenter="showNavFlyout($event, group)" @mouseleave="scheduleHideFlyout()">
            <div class="nav-label" x-text="group.label"></div>
            <template x-for="item in group.items" :key="item.path">
              <a class="nav-item" :class="{ active: isActive(item.path) }" :href="'#' + item.path" :title="item.label" @click="closeSidebar()">
                <i :data-lucide="item.icon"></i>
                <span class="nav-text" x-text="item.label"></span>
                <span class="nav-badge" x-show="item.badge && item.badge() > 0" x-text="item.badge ? item.badge() : ''"></span>
              </a>
            </template>
          </div>
        </template>
        <div class="nav-group nav-group-org" x-show="canSwitchOrganisation">
          <div class="nav-label">Organisation</div>
          <select class="select" :value="activeOrganisationId" @change="switchOrganisation($event.target.value)" aria-label="Active organisation">
            <template x-for="membership in (session ? session.memberships : [])" :key="membership.organisation.id">
              <option :value="membership.organisation.id" x-text="membership.organisation.name"></option>
            </template>
          </select>
        </div>
      </div>
      <div class="sidebar-footer">
        <div class="row" style="gap:8px">
          <div class="avatar" x-text="session ? initials(session.user.displayName) : ''"></div>
          <div class="sidebar-user" style="min-width:0">
            <div class="strong" style="font-size:0.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" x-text="session ? session.user.displayName : ''"></div>
            <div class="muted" style="font-size:0.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" x-text="roleLabel()"></div>
          </div>
          <button class="btn btn-ghost btn-icon btn-sm row-end sidebar-signout" @click="signOut()" title="Sign out" aria-label="Sign out"><i data-lucide="log-out"></i></button>
        </div>
      </div>
    </aside>

    <!-- Collapsed sidebar flyout: the group's items in a clickable popover. -->
    <div class="nav-flyout" x-show="navFlyout" x-cloak
      :style="navFlyout ? 'top:' + navFlyout.top + 'px;left:' + navFlyout.left + 'px' : ''"
      @mouseenter="cancelHideFlyout()" @mouseleave="scheduleHideFlyout()">
      <div class="nav-flyout-head" x-text="navFlyout ? navFlyout.label : ''"></div>
      <template x-for="item in (navFlyout ? navFlyout.items : [])" :key="item.path">
        <a class="nav-flyout-item" :class="{ active: isActive(item.path) }" :href="'#' + item.path" @click="closeSidebar()">
          <i :data-lucide="item.icon"></i>
          <span x-text="item.label"></span>
          <span class="nav-badge" x-show="item.badge && item.badge() > 0" x-text="item.badge ? item.badge() : ''"></span>
        </a>
      </template>
    </div>

    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost btn-icon sidebar-toggle" @click="toggleSidebar()" :title="navToggleLabel()" :aria-label="navToggleLabel()" :aria-expanded="navExpanded()">
          <span x-html="navToggleIconMarkup()"></span>
        </button>
        <div class="topbar-title" x-text="pageTitle"></div>
        <div class="topbar-spacer"></div>
        <button class="btn btn-secondary btn-sm topbar-search" @click="openCommand()" title="Search (Ctrl/Cmd + K)" aria-label="Search">
          <i data-lucide="search"></i>
          <span class="topbar-action-label">Search</span>
          <span class="muted mono topbar-shortcut" style="font-size:0.68rem">⌘K</span>
        </button>
        <button class="btn btn-primary btn-sm topbar-quick" @click="quickOpen = !quickOpen" aria-haspopup="true" :aria-expanded="quickOpen">
          <i data-lucide="plus"></i>
          <span class="topbar-action-label">Quick add</span>
        </button>
        <button class="btn btn-ghost btn-icon" @click="toggleTheme()" :title="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'" aria-label="Toggle theme">
          <span x-html="themeIconMarkup()"></span>
        </button>
        <div class="notif-wrap" @click.outside="notifOpen = false">
          <button class="btn btn-ghost btn-icon" @click="toggleNotifications()" :aria-expanded="notifOpen" aria-haspopup="true" title="Notifications" aria-label="Notifications" style="position:relative">
            <i data-lucide="bell"></i>
            <span class="badge badge-danger notif-badge" x-show="unread > 0" x-text="unread"></span>
          </button>
          <div class="notif-panel" x-show="notifOpen" x-cloak role="dialog" aria-label="Notifications">
            <div class="notif-head">
              <div>
                <div class="strong">Notifications</div>
                <div class="muted small" x-text="unread ? unread + (unread === 1 ? ' unread' : ' unread') : 'You are all caught up'"></div>
              </div>
              <button class="btn btn-ghost btn-sm" @click="markAllNotificationsRead()" x-show="unread > 0">Mark all read</button>
            </div>
            <div class="notif-list">
              <template x-for="item in notifications" :key="item.id">
                <button type="button" class="notif-item" :class="{ 'is-unread': !item.read_at }" @click="markNotificationRead(item)">
                  <span class="notif-dot" :class="{ 'is-unread': !item.read_at }"></span>
                  <span class="notif-copy">
                    <span class="notif-title" x-text="item.title"></span>
                    <span class="notif-body" x-text="item.body"></span>
                    <span class="notif-when" x-text="item.when"></span>
                  </span>
                </button>
              </template>
              <div class="notif-empty" x-show="notifLoading">Loading notifications…</div>
              <div class="notif-empty" x-show="!notifLoading && !notifications.length">
                <i data-lucide="bell-off"></i>
                <span>Nothing new right now.</span>
              </div>
            </div>
            <div class="notif-foot">
              <a href="#/app/communications" @click="notifOpen = false">Open communications</a>
              <a href="#/app/settings" @click="notifOpen = false">Notification settings</a>
            </div>
          </div>
        </div>
      </header>

      <div class="content">
        <div class="alert alert-danger" x-show="error && !loading" style="margin-bottom:16px">
          <i data-lucide="alert-triangle"></i>
          <div style="flex:1">
            <strong x-text="errorTitle || 'Something went wrong'"></strong>
            <div x-text="error"></div>
          </div>
          <button class="btn btn-sm btn-secondary" @click="reload()">Try again</button>
        </div>

        <div x-show="loading" class="loading-block">
          <span class="spinner spinner-lg"></span>
          <span>Loading…</span>
        </div>

        <div x-show="!loading && denied" class="empty-state">
          <div class="empty-icon"><i data-lucide="lock"></i></div>
          <template x-if="suspendedWorkspace">
            <div>
              <h3>Your workspace is suspended</h3>
              <p>Your subscription is unpaid. Pay the outstanding invoice to restore access automatically — it takes a minute and you can sign in again right away.</p>
              <a class="btn btn-primary" href="#/app/settings?tab=billing">Pay your subscription</a>
            </div>
          </template>
          <template x-if="!suspendedWorkspace">
            <div>
              <h3>You do not have access to this page</h3>
              <p>Your role does not include the permission required for this area. Ask an administrator if you believe this is a mistake.</p>
              <a class="btn btn-primary" href="#/app/overview">Return to your overview</a>
            </div>
          </template>
        </div>

        <div id="view-root" x-show="!loading && !denied"></div>
      </div>
    </div>

    <!-- Quick add menu -->
    <div x-show="quickOpen" x-cloak class="modal-backdrop" @click.self="quickOpen = false" style="align-items:flex-start;padding-top:12vh">
      <div class="modal modal-narrow">
        <div class="modal-head"><h3>Quick add</h3><button class="btn btn-ghost btn-icon btn-sm row-end" @click="quickOpen = false" aria-label="Close"><i data-lucide="x"></i></button></div>
        <div class="modal-body">
          <div class="stack">
            <template x-for="action in quickActions" :key="action.label">
              <button class="btn btn-secondary" style="justify-content:flex-start" @click="quickOpen = false; runQuickAction(action)">
                <i :data-lucide="action.icon"></i><span x-text="action.label"></span>
              </button>
            </template>
            <div class="muted small" x-show="!quickActions.length">No quick actions are available for your role.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Generic modal -->
  <div class="modal-backdrop" x-show="modal" x-cloak @click.self="closeModal()">
    <div class="modal" :class="modal && modal.size === 'wide' ? 'modal-wide' : (modal && modal.size === 'narrow' ? 'modal-narrow' : '')" role="dialog" aria-modal="true" :aria-label="modal ? modal.title : ''">
      <div class="modal-head">
        <h3 x-text="modal ? modal.title : ''"></h3>
        <button class="btn btn-ghost btn-icon btn-sm row-end" @click="closeModal()" aria-label="Close"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body">
        <div class="alert alert-danger" x-show="modal && modal.error" style="margin-bottom:12px"><i data-lucide="alert-circle"></i><span x-text="modal ? modal.error : ''"></span></div>
        <div x-show="modal && modal.description" class="muted" style="margin-bottom:14px" x-text="modal ? modal.description : ''"></div>
        <div x-show="modal && modal.descriptionHtml" class="muted form-description" style="margin-bottom:14px" x-html="modal ? modal.descriptionHtml : ''"></div>
        <div x-show="modal && modal.type === 'detail'" x-html="modal ? modal.html : ''"></div>
        <div x-show="modal && modal.type === 'confirm'">
          <div class="alert" :class="modal && modal.danger ? 'alert-warn' : 'alert-info'" style="margin-bottom:10px">
            <i data-lucide="alert-triangle"></i>
            <span x-text="modal ? modal.message : ''"></span>
          </div>
        </div>
        <form x-show="modal && modal.type === 'form'" @submit.prevent="submitModal()">
          <div class="form-grid">
            <template x-for="field in (modal ? modal.fields : [])" :key="field.name">
              <div class="field" :class="field.span === 2 ? 'span-2' : ''" x-show="fieldVisible(field)">
                <label :for="'modal-' + field.name" x-text="field.label"></label>
                <template x-if="field.type === 'preset'">
                  <div class="preset-grid">
                    <template x-for="preset in (field.presets || [])" :key="preset.key">
                      <button type="button" class="preset-card" :class="modal.data[field.name] === preset.key ? 'active' : ''" @click="applyFormPreset(preset.key)">
                        <span class="preset-title" x-text="preset.label"></span>
                        <span class="preset-sub" x-text="preset.description"></span>
                      </button>
                    </template>
                  </div>
                </template>
                <template x-if="field.type === 'textarea'">
                  <textarea class="textarea" :id="'modal-' + field.name" :name="field.name" :required="field.required === true" :placeholder="field.placeholder || ''" x-model="modal.data[field.name]"></textarea>
                </template>
                <template x-if="field.type === 'select'">
                  <select class="select" :id="'modal-' + field.name" :name="field.name" :required="field.required === true" x-model="modal.data[field.name]" x-init="$nextTick(() => { const want = modal.data[field.name]; $el.value = want === undefined || want === null ? '' : String(want); })">
                    <option value="">Select…</option>
                    <template x-for="option in (field.options || [])" :key="option.value !== undefined ? option.value : option">
                      <option :value="option.value !== undefined ? option.value : option" x-text="option.label !== undefined ? option.label : option"></option>
                    </template>
                  </select>
                </template>
                <template x-if="field.type === 'radio'">
                  <div class="radio-group">
                    <template x-for="option in (field.options || [])" :key="option.value !== undefined ? option.value : option">
                      <label class="check">
                        <input type="radio" :name="field.name" :value="option.value !== undefined ? option.value : option" :required="field.required === true" x-model="modal.data[field.name]">
                        <span x-text="option.label !== undefined ? option.label : option"></span>
                      </label>
                    </template>
                  </div>
                </template>
                <template x-if="field.type === 'checkbox'">
                  <label class="check"><input type="checkbox" :id="'modal-' + field.name" :required="field.required === true" x-model="modal.data[field.name]"><span x-text="field.help || 'Enabled'"></span></label>
                </template>
                <template x-if="field.type === 'checkboxes'">
                  <div class="radio-group">
                    <template x-for="option in (field.options || [])" :key="option.value !== undefined ? option.value : option">
                      <label class="check">
                        <input type="checkbox" :value="option.value !== undefined ? option.value : option" :checked="(modal.data[field.name] || []).includes(option.value !== undefined ? option.value : option)" @change="toggleModalChoice(field, option.value !== undefined ? option.value : option, $event.target.checked)">
                        <span x-text="option.label !== undefined ? option.label : option"></span>
                      </label>
                    </template>
                  </div>
                </template>
                <template x-if="field.type === 'formfile'">
                  <div class="media-field">
                    <input class="input" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,.doc,.docx,.txt,.csv" @change="uploadModalFormFile(field, $event)">
                    <div class="hint" x-show="modal.mediaBusy && modal.mediaBusy[field.name]">Uploading…</div>
                    <div class="hint" x-show="modal.data[field.name]"><a :href="modal.data[field.name]" target="_blank" rel="noopener">View uploaded file</a> · <button type="button" class="btn btn-sm btn-ghost" @click="clearModalMedia(field)">Remove</button></div>
                  </div>
                </template>
                <template x-if="field.type === 'media'">
                  <div class="media-field">
                    <input class="input" type="file" :multiple="field.multiple === true" :accept="field.accept || 'image/*,video/*,audio/*,application/pdf'" @change="uploadModalMedia(field, $event)">
                    <template x-if="!field.multiple">
                      <input class="input" :id="'modal-' + field.name" :name="field.name" type="url" :required="field.required === true" :placeholder="field.placeholder || 'Upload a file or paste a link'" x-model="modal.data[field.name]">
                    </template>
                    <template x-if="field.multiple">
                      <div class="row" style="gap:8px;align-items:center">
                        <input class="input" type="url" placeholder="Paste a link and press Add" x-model="modal.mediaDraft[field.name]">
                        <button type="button" class="btn btn-sm btn-secondary" @click="addModalMediaUrl(field)"><i data-lucide="plus"></i> Add</button>
                      </div>
                    </template>
                    <template x-if="!field.multiple && modal.data[field.name]">
                      <div class="media-preview">
                        <div x-html="mediaPreview(field, modal.data[field.name])"></div>
                        <button type="button" class="btn btn-sm btn-ghost" @click="clearModalMedia(field)"><i data-lucide="x"></i> Remove</button>
                      </div>
                    </template>
                    <template x-if="field.multiple">
                      <div class="media-list">
                        <template x-for="(url, index) in (modal.data[field.name] || [])" :key="url + index">
                          <div class="media-preview">
                            <div x-html="mediaPreview(field, url)"></div>
                            <button type="button" class="btn btn-sm btn-ghost" @click="removeModalMedia(field, index)"><i data-lucide="x"></i> Remove</button>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
                <template x-if="field.type === 'colour'">
                  <div class="colour-field">
                    <input class="colour-swatch-input" type="color" :value="modal.data[field.name] || '#3A7D44'" @input="modal.data[field.name] = $event.target.value.toUpperCase()" aria-label="Colour picker">
                    <input class="input mono" :id="'modal-' + field.name" :name="field.name" type="text" maxlength="7" pattern="^#[0-9A-Fa-f]{6}$" title="Six-digit hex colour, for example #3A7D44" :required="field.required === true" :placeholder="field.placeholder || '#3A7D44'" x-model="modal.data[field.name]">
                  </div>
                </template>
                <template x-if="field.type === 'multiselect'">
                  <div class="ms-field">
                    <div class="ms-chips">
                      <template x-for="value in (modal.data[field.name] || [])" :key="value">
                        <span class="ms-chip">
                          <template x-if="msOption(field, value) && msOption(field, value).avatarUrl">
                            <img class="avatar avatar-xs" :src="msOption(field, value).avatarUrl" alt="">
                          </template>
                          <span x-text="msOption(field, value) ? msOption(field, value).label : value"></span>
                          <button type="button" class="ms-chip-x" @click="toggleMs(field, value)" :aria-label="'Remove ' + value">&times;</button>
                        </span>
                      </template>
                      <span class="muted small" x-show="!(modal.data[field.name] || []).length">None selected</span>
                    </div>
                    <div class="ms-controls">
                      <input class="input" type="search" :placeholder="field.placeholder || 'Search…'" x-model="modal.msQuery[field.name]" @keydown.enter.prevent>
                      <button type="button" class="btn btn-sm btn-secondary" @click="msSelectAll(field)">Select all</button>
                      <button type="button" class="btn btn-sm btn-ghost" @click="msClear(field)">Clear</button>
                    </div>
                    <div class="ms-options">
                      <template x-for="option in msOptions(field)" :key="option.value">
                        <label class="ms-option">
                          <input type="checkbox" :checked="isMsSelected(field, option.value)" @change="toggleMs(field, option.value)">
                          <template x-if="option.avatarUrl">
                            <img class="avatar avatar-xs" :src="option.avatarUrl" alt="">
                          </template>
                          <span class="ms-option-text">
                            <span x-text="option.label"></span>
                            <span class="cell-sub" x-show="option.subtitle" x-text="option.subtitle"></span>
                          </span>
                        </label>
                      </template>
                      <div class="muted small" x-show="!msOptions(field).length">No matches</div>
                    </div>
                  </div>
                </template>
                <template x-if="field.type === 'repeater'">
                  <div class="rep-field">
                    <template x-for="(row, index) in (modal.data[field.name] || [])" :key="index">
                      <div class="rep-row">
                        <div class="rep-row-head">
                          <span class="rep-index" x-text="(field.itemLabel || 'Item') + ' ' + (index + 1)"></span>
                          <span class="spacer"></span>
                          <button type="button" class="btn btn-sm btn-ghost btn-icon" @click="moveRepeaterRow(field, index, -1)" :disabled="Boolean(index === 0)" aria-label="Move up"><i data-lucide="arrow-up"></i></button>
                          <button type="button" class="btn btn-sm btn-ghost btn-icon" @click="moveRepeaterRow(field, index, 1)" :disabled="Boolean(index === (modal.data[field.name] || []).length - 1)" aria-label="Move down"><i data-lucide="arrow-down"></i></button>
                          <button type="button" class="btn btn-sm btn-ghost btn-icon" @click="removeRepeaterRow(field, index)" aria-label="Remove"><i data-lucide="trash-2"></i></button>
                        </div>
                        <div class="rep-grid">
                          <template x-for="column in (field.columns || [])" :key="column.key">
                            <label class="rep-cell" :class="column.span === 2 ? 'span-2' : ''">
                              <span class="rep-label" x-text="column.label"></span>
                              <template x-if="column.type === 'select'">
                                <select class="select" x-model="row[column.key]" x-init="$nextTick(() => { const want = row[column.key]; $el.value = want === undefined || want === null ? '' : String(want); })">
                                  <template x-for="opt in repOptions(column)" :key="opt.value">
                                    <option :value="opt.value" x-text="opt.label"></option>
                                  </template>
                                </select>
                              </template>
                              <template x-if="column.type === 'checkbox'">
                                <input type="checkbox" x-model="row[column.key]">
                              </template>
                              <template x-if="column.type === 'textarea'">
                                <textarea class="textarea" rows="2" x-model="row[column.key]" :placeholder="column.placeholder || ''"></textarea>
                              </template>
                              <template x-if="!column.type || !['select','checkbox','textarea'].includes(column.type)">
                                <input class="input" :type="column.type || 'text'" x-model="row[column.key]" :placeholder="column.placeholder || ''">
                              </template>
                            </label>
                          </template>
                        </div>
                      </div>
                    </template>
                    <div class="muted small" x-show="!(modal.data[field.name] || []).length">No items yet.</div>
                    <button type="button" class="btn btn-sm btn-secondary" @click="addRepeaterRow(field)"><i data-lucide="plus"></i> <span x-text="field.addLabel || 'Add item'"></span></button>
                  </div>
                </template>
                <template x-if="!field.type || !['textarea','select','checkbox','checkboxes','formfile','media','colour','multiselect','repeater','preset','radio'].includes(field.type)">
                  <input class="input" :id="'modal-' + field.name" :name="field.name" :type="field.type || 'text'" :required="field.required === true" :placeholder="field.placeholder || ''" :min="field.min" :max="field.max" :step="field.step" x-model="modal.data[field.name]">
                </template>
                <div class="hint" x-show="field.help && field.type !== 'checkbox'" x-text="field.type === 'media' && modal.mediaBusy && modal.mediaBusy[field.name] ? 'Uploading…' : (field.help || '')"></div>
              </div>
            </template>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" @click="closeModal()">Cancel</button>
            <button type="submit" class="btn btn-primary" :disabled="Boolean(modal && modal.saving)">
              <span class="spinner" x-show="modal && modal.saving" style="width:14px;height:14px"></span>
              <span x-text="modal ? (modal.submitLabel || 'Save') : 'Save'"></span>
            </button>
          </div>
        </form>
      </div>
      <div class="modal-foot" x-show="modal && modal.type === 'detail'">
        <button class="btn btn-secondary" @click="closeModal()">Close</button>
      </div>
      <div class="modal-foot" x-show="modal && modal.type === 'confirm'">
        <button class="btn btn-secondary" @click="closeModal()">Cancel</button>
        <button class="btn" :class="modal && modal.danger ? 'btn-danger' : 'btn-primary'" @click="confirmModal()" :disabled="Boolean(modal && modal.saving)">
          <span class="spinner" x-show="modal && modal.saving" style="width:14px;height:14px"></span>
          <span x-text="modal ? modal.submitLabel : 'Confirm'"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Command palette -->
  <div class="command-backdrop" x-show="commandOpen" x-cloak @click.self="commandOpen = false">
    <div class="command" role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="command-input">
        <i data-lucide="search"></i>
        <input type="text" x-ref="commandInput" x-model="commandQuery" @input.debounce.180ms="runCommandSearch()" @keydown.arrow-down.prevent="commandIndex = Math.min(commandIndex + 1, commandResults.length - 1)" @keydown.arrow-up.prevent="commandIndex = Math.max(commandIndex - 1, 0)" @keydown.enter.prevent="selectCommand(commandResults[commandIndex])" placeholder="Search learners, staff, pages or actions…" aria-label="Search">
        <span class="muted small">Esc</span>
      </div>
      <div class="command-results">
        <template x-for="(result, index) in commandResults" :key="result.key || result.route || result.label">
          <div class="command-item" :class="{ active: index === commandIndex }" @click="selectCommand(result)" @mouseenter="commandIndex = index">
            <i :data-lucide="result.icon || 'arrow-right'"></i>
            <span x-text="result.label"></span>
            <span class="cmd-kind" x-text="result.kind"></span>
          </div>
        </template>
        <div class="command-empty" x-show="!commandResults.length">No results. Try a learner name, staff member or page.</div>
      </div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toast-root" aria-live="polite">
    <template x-for="toast in toasts" :key="toast.id">
      <div class="toast" :class="toast.type">
        <i :data-lucide="toast.type === 'error' ? 'alert-circle' : (toast.type === 'warn' ? 'alert-triangle' : 'check-circle')"></i>
        <div style="flex:1"><div x-text="toast.message"></div></div>
        <button class="btn btn-ghost btn-icon btn-sm" @click="dismissToast(toast.id)" aria-label="Dismiss"><i data-lucide="x"></i></button>
      </div>
    </template>
  </div>

  <noscript>
    <div style="padding:32px;font-family:sans-serif">Re-EL ECD requires JavaScript to run. Please enable JavaScript in your browser.</div>
  </noscript>
</body>
</html>
